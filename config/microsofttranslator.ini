[Service]
Name=Microsoft Translate
Order=15
AutoSwapLanguage=1
ValueType=Language
ColorRecent=1073360

RealTimeTranslation=1
TranslateOnlyByButton=0
Visible=1
AllowProxy=1

[Service Description]
0=Microsoft Translate — this configuration uses an unofficial web endpoint of Microsoft used by the Microsoft Translator web interface (Bing Translator). It sends a POST request to a browser-backed translation API and returns translated text in JSON format. The request relies on session parameters (such as tokens and cookies) that are typically generated by the web page itself.
1=
2=Legal note: this endpoint is not an officially documented public API. It is part of Microsoft’s web translation infrastructure and is intended for use by Microsoft’s own web applications. In practice, it may work for lightweight, user-driven usage such as a desktop translator with manual input, but it is not guaranteed to be stable or officially supported for third-party integration.
3=
4=For reliable, long-term, or commercial usage, it is recommended to use the official Microsoft Translator API via Azure, which provides authentication, quotas, and supported endpoints:
5=
6=https://learn.microsoft.com/azure/ai-services/translator
7=
8=The user is responsible for ensuring appropriate use according to the service provider’s terms and conditions.

[Request]
Method=POST
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
EncodeText=1
Url=https://www.bing.com/ttranslatev3?isVertical=1&IG={IG}&IID=translator.5033
ContentType=application/x-www-form-urlencoded
PostData=text={text}&fromLang={source}&to={target}&token={token}&key={key}
Accept=application/json
MaxLength=1400

[Headers]
0=Accept-Language=en-US,en;q=0.9
1=Cookie=MUID={MUID}

[Response]
JsonPointer={Error: Wrong response structure!#10{<div class="title">([^<]+)<\/div>}}!/0/translations/0/text; /0/translations/0/text;

[Parameters]
EncodeCustomParameters=1

[Initial Request]
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
Url=https://www.bing.com/translator
LiveTime=600

[Initial Headers]
Accept=text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
Accept-Language=en-US,en;q=0.9
Accept-Encoding=gzip, deflate
Connection=keep-alive

[Initial Parameters]
key=params_AbusePreventionHelper\s*=\s*\[\s*(\d+)
token=params_AbusePreventionHelper\s*=\s*\[\s*\d+\s*,\s*"([^"]+)"
IG=IG:"([A-F0-9]+)"
MUID=MUID=([^;]+)

