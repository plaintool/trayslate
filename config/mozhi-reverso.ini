[Service]
Order=20
Visible=1
AutoSwapLanguage=1
RealTimeTranslation=1
TranslateOnlyByButton=0
AllowProxy=1
ColorRecent=3162256
ValueType=Language
Name=Mozhi - Reverso


[Request]
Method=GET
EncodeText=1
MaxLength=3500
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
Accept=application/json
Url=https://mozhi.adminforge.de/api/translate?engine=reverso&from={source}&to={target}&text={text}

[Parameters]
EncodeCustomParameters=0

