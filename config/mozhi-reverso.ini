[Service Description]
0=Mozhi (alternative frontend) — this configuration uses Mozhi, an open-source alternative frontend that proxies translation requests to multiple third-party engines (Google, Yandex, DeepL, DuckDuckGo, LibreTranslate, and others). It sends requests to the selected engine through Mozhi’s API and returns a unified response containing the translated text. The configuration supports many languages and multiple engines, with optional source-language detection and engine selection.
1=
2=Legal note: Mozhi is not part of the official APIs of the translation engines and has no partnership with them. It is an unofficial intermediary that forwards requests to public or undocumented web endpoints. Such automated access may be restricted, rate-limited, blocked, or changed at any time, and in many cases may violate the providers’ Terms of Service. Therefore, this configuration is provided strictly for educational, experimental, and compatibility purposes only.
3=
4=For legal and stable usage, it is recommended to use the official APIs of the translation providers, which offer authenticated access, documentation, and compliance guarantees. The user is solely responsible for how this configuration is used and must ensure compliance with the service providers’ terms, licensing conditions, and applicable regulations.
5=
6=Service link: https://mozhi.adminforge.de/
