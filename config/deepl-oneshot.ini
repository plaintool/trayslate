[Service]
Name=DeepL OneShot
Order=14
AutoSwapLanguage=1
ColorRecent=11558912
ValueType=Language

RealTimeTranslation=0
TranslateOnlyByButton=0
Visible=1
AllowProxy=1

[Service Description]
0=DeepL Translate — this configuration uses the unofficial DeepL OneShot endpoint provided by DeepL SE to translate text between supported languages. It sends translation requests in JSON format and receives translated text in JSON responses. The endpoint uses DeepL's next-generation translation model.
1=
2=Legal note: the OneShot endpoint is part of DeepL's internal web service infrastructure and is not an officially published or supported public API. Its availability, request limits, and access requirements may change at any time without notice. Automated access through this endpoint is not an officially supported integration method.
3=
4=For this reason, this configuration should be considered an experimental technical implementation intended for informational and educational purposes. It is not affiliated with or endorsed by DeepL.
5=
6=For reliable and compliant production usage, it is recommended to use the official DeepL API, which provides documented access, authentication, and licensed usage terms:
7=
8=https://www.deepl.com/pro-api

[Headers]
0=Accept=*/*
1=Accept-Language=en-US,en;q=0.5
2=Authorization=None
3=Content-Type=application/json; charset=utf-8
4=Host=oneshot-free.www.deepl.com
5=Origin=chrome-extension://cofdbpoegempjloogbagkncekinflcnj
6=Sec-Fetch-Dest=empty
7=Sec-Fetch-Mode=cors
8=Sec-Fetch-Site=cross-site

[Request]
Method=POST
UserAgent=DeepLBrowserExtension/1.28.0 Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
EncodeText=0
Url=https://oneshot-free.www.deepl.com/v1/translate
ContentType=application/json; charset=utf-8
PostData={\r\n  "text": [\r\n    "{text}"\r\n  ],\r\n  "target_lang": "{target}",\r\n  "source_lang": "{source}"\r\n}
Accept=*/*
MaxLength=5000

[Response]
JsonPointer=/translations/0/text; /error/message; {{<h1[^>]*>(.*?)</h1>[*]}#10{<p[^>]*>(.*?)</p>[*#10]}}!/translations/0/text

[Parameters]
EncodeCustomParameters=1

