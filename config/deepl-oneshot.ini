[Script Parameters]
0=#//------------------------------------------------------------------------------
1=#// User script for DeepL request preparation
2=#//------------------------------------------------------------------------------
3=#
4=#//------------------------------------------------------------------------------
5=#// Adding a text marker "\n" before each newline character.
6=#//------------------------------------------------------------------------------
7=#function AddNewLineMarkers(const S: string): string;
8=#begin
9=#  Result := S;
10=#  if Result = '' then Exit;
11=#
12=#  Result := ReplaceAll(Result, #13#10, '<br>', False);
13=#  Result := ReplaceAll(Result, #10, '<br>', False);
14=#  Result := ReplaceAll(Result, #13, '<br>', False);
15=#end;
16=#
17=#//------------------------------------------------------------------------------
18=#// Main block – executed when the script runs
19=#//------------------------------------------------------------------------------
20=#var
21=#  txt: string;
22=#begin
23=#  // Retrieve input parameters using GetParam
24=#  txt := GetParam('text');
25=#
26=#  // New Line Markers
27=#  txt := AddNewLineMarkers(txt);
28=#  SetOutput('text', txt);
29=#end.
