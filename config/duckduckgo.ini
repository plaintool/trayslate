[Service Description]
0=DuckDuckGo Translate — this configuration uses DuckDuckGo’s built-in translation service directly, without an intermediary such as Mozhi. It retrieves a temporary `vqd` token from DuckDuckGo’s website using a GET request, then sends the translation text through a POST request to DuckDuckGo’s internal translation endpoint. The response contains the detected source language (when available) and the translated text. The configuration supports source-language detection and the language pairs exposed by DuckDuckGo’s translation service.
1=
2=Legal note: DuckDuckGo Translate does not provide a documented public translation API for this integration. The configuration relies on an internal web endpoint used by DuckDuckGo’s website. Automated access to this endpoint may be restricted, rate-limited, blocked, or changed at any time, and may be subject to DuckDuckGo’s Terms of Service. Therefore, this configuration is provided strictly for educational, experimental, and compatibility purposes only.
3=
4=For legal and stable usage, it is recommended to use official translation APIs that provide authenticated access, documentation, and defined usage conditions. The user is solely responsible for how this configuration is used and must ensure compliance with the service provider’s terms, licensing conditions, and applicable regulations.
5=
6=Service link: https://duckduckgo.com/

