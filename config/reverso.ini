[Service]
Name=Reverso Translate
Order=18
AutoSwapLanguage=1
ColorRecent=4194464
ValueType=Language
RealTimeTranslation=1
TranslateOnlyByButton=0
Visible=1
AllowProxy=1


[Service Description]
0=Reverso Translate — this configuration uses the public JSON‑RPC endpoint of Reverso (api.reverso.net) to perform text translation between supported languages. It sends a structured JSON request identical to the one used by Reverso's own web application and returns the translated text in JSON format.
1=
2=Legal note: the endpoint api.reverso.net is part of Reverso’s web infrastructure and is not an officially published or supported public API. Automated access to this endpoint may conflict with Reverso’s Terms of Service, which typically prohibit non‑browser or unauthorized scripted access. The only officially intended way to use Reverso interactively is through their web interface at https://www.reverso.net/text-translation.
3=
4=For this reason, this configuration should be considered an example of a technical implementation and is intended for informational and educational purposes. It is not an officially endorsed integration method.
5=
6=For compliant and production usage, it is recommended to use Reverso’s official services in accordance with their Terms of Service. If you need programmatic access, consider exploring Reverso’s partnership or API licensing options (if available):
7=
8=https://www.reverso.net

[Request]
Method=POST
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36
EncodeText=0
Url=https://api.reverso.net/translate/v1/translation
ContentType=application/json; charset=utf-8
PostData={"from":"{source}","to":"{target}","input":"{text}","format":"text","options":{"origin":"contextweb","sentenceSplitter":false,"contextResults":false}}
Accept=*/*
MaxLength=5000

[Headers]
0=Origin=https://www.reverso.net
1=Referer=https://www.reverso.net/text-translation
2=Accept=application/json, text/plain, */*
3=Accept-Language=en-US,en;q=0.9
4=Content-Type=application/json

[Response]
JsonPointer=/translation/0; /error/message

[Parameters]
EncodeCustomParameters=1

