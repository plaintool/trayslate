[Script Parameters]
0=#//------------------------------------------------------------------------------
1=#// Script for YandexAppId1 generation
2=#//------------------------------------------------------------------------------
3=#
4=#const
5=#  HexChars = '0123456789abcdef';
6=#
7=#function GenerateYandexUUID: string;
8=#var
9=#  e: Int64;
10=#  i, n, val: Integer;
11=#begin
12=#  e := GetTimestamp;
13=#
14=#  Result := '';
15=#
16=#  for i := 1 to 32 do
17=#  begin
18=#    if i = 13 then
19=#      Result := Result + '4'
20=#    else
21=#    if i = 17 then
22=#    begin
23=#      n := (e mod 16) xor ((i * 7) mod 16);
24=#
25=#      e := e div 16;
26=#
27=#      val := (n and 3) or 8;
28=#
29=#      Result := Result + HexChars[val + 1];
30=#    end
31=#    else
32=#    begin
33=#      n := (e mod 16) xor ((i * 7) mod 16);
34=#      e := e div 16;
35=#      val := n;
36=#
37=#      Result := Result + HexChars[val + 1];
38=#    end;
39=#  end;
40=#end;
41=#
42=#//------------------------------------------------------------------------------
43=#// Main block – executed when the script runs
44=#//------------------------------------------------------------------------------
45=#var
46=#  YandexAppId1: string;
47=#begin
48=#  YandexAppId1 := GenerateYandexUUID;
49=#
50=#  SetOutput('YandexAppId1', YandexAppId1);
51=#end.

