[Service Description]
0=Yandex Translate (legacy API) — this configuration uses a legacy Yandex Translate API endpoint to translate text between languages. It sends requests containing the source language, target language, and input text, and returns a JSON response with the translated result. The configuration supports multiple language pairs and optional automatic source language detection.
1=
2=Legal note: this configuration relies on a legacy Yandex Translate API that is no longer part of the current official Yandex Cloud Translation service. It is not documented or supported for new public integrations and may be restricted, rate-limited, modified, or discontinued at any time by Yandex. Automated or programmatic access to this endpoint may violate Yandex's Terms of Service or other applicable policies. Therefore, this configuration is provided strictly for educational, experimental, and compatibility purposes only.
3=
4=For legal and stable usage, it is recommended to use the official Yandex Cloud Translation API, which provides authenticated access, documentation, and supported integration:
5=
6=https://translate.yandex.com
7=
8=The user is solely responsible for how this configuration is used and must ensure compliance with the service provider's terms, licensing conditions, and applicable regulations.

